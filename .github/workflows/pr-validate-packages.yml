name: Validate NPM Packages (PR)

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  # 1. Setup job: Install and Build everything once
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm ci

      - name: Build all workspace packages
        # Building everything at the root ensures all internal dependencies are ready
        run: npm run build --workspaces --if-present

      - name: Cache build outputs
        # This caches the build folders (dist, lib, etc.) so the matrix jobs can grab them
        uses: actions/cache/save@v4
        with:
          path: |
            **/dist
            **/lib
            **/build
            node_modules
          key: ${{ github.sha }}-build-artifacts

  # 2. Matrix job: Runs tests for specific packages
  validate-package:
    needs: setup
    name: Validate ${{ matrix.package_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: core
            workspace_name: core
            package_mode: workspace
          - package_name: combat
            workspace_name: combat
            package_mode: workspace
          - package_name: worldgraph
            workspace_name: worldgraph
            package_mode: workspace
          - package_name: dialogue
            workspace_name: dialogue
            package_mode: workspace
          - package_name: server
            workspace_name: server
            package_mode: workspace
          - package_name: dialogue-angular-demo
            package_path: dialogue/examples/angular-demo
            package_mode: standalone
          - package_name: valeflow-vscode-extension
            package_path: dialogue/extensions/vscode-valeflow
            package_mode: standalone
          - package_name: game
            workspace_name: game
            package_mode: workspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            **/dist
            **/lib
            **/build
            node_modules
          key: ${{ github.sha }}-build-artifacts
          fail-on-cache-miss: true

      - name: Run workspace validation scripts
        if: matrix.package_mode == 'workspace'
        run: |
          npm run check --workspace=${{ matrix.workspace_name }} --if-present
          npm run test --workspace=${{ matrix.workspace_name }} --if-present

      - name: Run standalone package validation scripts
        if: matrix.package_mode == 'standalone'
        working-directory: ${{ matrix.package_path }}
        run: |
          # Standalone packages might need their own unique install if they aren't part of the root workspace
          if [ ! -d "node_modules" ]; then
            npm ci
          fi
          npm run check --if-present
          npm run test --if-present