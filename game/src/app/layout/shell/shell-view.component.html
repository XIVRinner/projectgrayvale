<div class="gv-shell" [attr.data-layout]="layoutPreset()">
  <gv-shell-topbar
    [title]="title()"
    [subtitle]="subtitle()"
    [statusItems]="statusItems()"
    [saveSummary]="saveSummary()"
    [actions]="topbarActions()"
    (saveManagerRequested)="saveManagerOpenRequested.emit()"
    (actionRequested)="topbarActionSelected.emit($event)"
  />

  <main
    class="gv-shell__content-grid"
    [class.gv-shell__content-grid--command-center]="isCommandCenter()"
  >
    <aside class="gv-shell__panel gv-shell__sidebar">
      <gv-shell-character-panel
        [panel]="characterPanel()"
        (actionSelected)="characterPanelActionSelected.emit($event)"
      />
    </aside>

    <section class="gv-shell__middle-stack">
      <article class="gv-shell__panel gv-shell__feature-panel">
        <router-outlet />
      </article>

      <article class="gv-shell__panel gv-shell__action-panel">
        <gv-shell-action-panel
          [groups]="actionGroups()"
          (actionSelected)="actionSelected.emit($event)"
        />
      </article>
    </section>

    <aside class="gv-shell__panel gv-shell__intel-panel">
      <gv-shell-quest-tracker
        [panel]="questTrackerPanel()"
        (openQuestLogRequested)="questLogOpenRequested.emit()"
      />

      <gv-shell-mini-chat
        [panel]="miniChatPanel()"
        [canSend]="canSendServerChat()"
        [isSending]="isServerChatSending()"
        [sendHint]="serverChatSendHint()"
        [statusMessage]="serverChatStatusMessage()"
        (refreshRequested)="serverChatRefreshRequested.emit()"
        (openServerSelectRequested)="serverChatServerSelectRequested.emit()"
        (openFullChatRequested)="serverInfoRequested.emit()"
        (sendRequested)="serverChatSendRequested.emit($event)"
      />
    </aside>
  </main>

  <gv-shell-footer
    [version]="version()"
    [serverSummary]="serverFooterSummary()"
    [canOpenKairosEdit]="canOpenKairosEdit()"
    [whatsNewUnreadCount]="whatsNewUnreadCount()"
    (gegVisualizerRequested)="gegVisualizerOpenRequested.emit()"
    (kairosEditRequested)="kairosEditRequested.emit()"
    (serverInfoRequested)="serverInfoRequested.emit()"
    (whatsNewRequested)="whatsNewOpenRequested.emit()"
  />

  <gv-shell-kairos-edit-dialog
    [open]="isKairosEditOpen()"
    (closed)="kairosEditCloseRequested.emit()"
  />

  <gv-shell-save-manager-modal
    [open]="isSaveManagerOpen()"
    [slots]="saveSlots()"
    [transferPayload]="transferPayload()"
    [statusMessage]="transferStatusMessage()"
    (characterCreationRequested)="characterCreationOpenRequested.emit()"
    (closed)="saveManagerCloseRequested.emit()"
    (slotLoadRequested)="saveSlotLoadRequested.emit($event)"
    (slotDeleteRequested)="saveSlotDeleteRequested.emit($event)"
    (slotExportRequested)="saveSlotExportRequested.emit($event)"
    (exportAllRequested)="saveExportAllRequested.emit()"
    (importRequested)="saveImportRequested.emit()"
    (resetRequested)="saveResetRequested.emit()"
    (transferPayloadChanged)="saveTransferPayloadChanged.emit($event)"
  />

  <gv-shell-server-select-modal
    [open]="isServerSelectOpen()"
    [servers]="servers()"
    [selectedServerId]="selectedServerId()"
    [activePlayerUuid]="activePlayerUuid()"
    [statusMessage]="serverStatusMessage()"
    [serverProfile]="serverProfile()"
    (closed)="serverSelectCloseRequested.emit()"
    (selectedServerChanged)="serverChanged.emit($event)"
    (serverAdded)="serverAdded.emit($event)"
    (connectRequested)="serverConnectRequested.emit($event)"
    (giveAdminRequested)="serverGiveAdminRequested.emit($event)"
  />

  <gv-shell-server-chat-dialog
    [open]="isServerChatOpen()"
    [panel]="serverChatPanel()"
    [relayProfile]="serverRelayProfile()"
    [players]="serverChatPlayers()"
    [messages]="serverChatMessages()"
    [customEmojis]="serverChatCustomEmojis()"
    [commands]="serverChatCommands()"
    [channels]="serverChatPanel().channels"
    [activeChannelId]="serverChatPanel().activeChannelId"
    [currentPlayerUuid]="currentServerChatPlayerUuid()"
    [statusMessage]="serverChatStatusMessage()"
    [canSend]="canSendServerChat()"
    [canModerate]="canModerateServerChat()"
    [canBlockServerEntry]="canBlockServerEntry()"
    [isSending]="isServerChatSending()"
    [sendHint]="serverChatSendHint()"
    [selectedModerationPlayer]="selectedModerationPlayer()"
    [moderationStatusMessage]="serverModerationStatusMessage()"
    [isModerationSubmitting]="isServerModerationSubmitting()"
    [canShowAdminPanel]="canShowAdminPanel()"
    [adminEntries]="adminEntries()"
    [adminTotal]="adminTotal()"
    [adminPage]="adminPage()"
    [adminPageSize]="adminPageSize()"
    [adminSearch]="adminSearch()"
    [adminLoading]="adminLoading()"
    [selectedAdminProfileId]="selectedAdminProfileId()"
    [adminProfileDetail]="adminProfileDetail()"
    [grantablePermissions]="grantablePermissions()"
    [socialPlayers]="socialPlayers()"
    [socialPlayersTotal]="socialPlayersTotal()"
    [socialPlayersPage]="socialPlayersPage()"
    [socialPlayersPageSize]="socialPlayersPageSize()"
    [socialPlayersSearch]="socialPlayersSearch()"
    [socialPlayersLoading]="socialPlayersLoading()"
    [friendships]="friendships()"
    [friendsLoading]="friendsLoading()"
    [currentGuild]="currentGuild()"
    [guildInvitations]="guildInvitations()"
    [guildLoading]="guildLoading()"
    (closed)="serverChatCloseRequested.emit()"
    (refreshRequested)="serverChatRefreshRequested.emit()"
    (grantAdminRequested)="serverChatGrantAdminRequested.emit()"
    (moderatePlayerRequested)="serverChatModeratePlayerRequested.emit($event)"
    (channelSelected)="serverChatChannelSelected.emit($event)"
    (playerActionRequested)="serverChatPlayerActionRequested.emit($event)"
    (adminSearchChanged)="adminSearchChanged.emit($event)"
    (adminPageChanged)="adminPageChanged.emit($event)"
    (adminProfileSelected)="adminProfileSelected.emit($event)"
    (adminPermissionGranted)="adminPermissionGranted.emit($event)"
    (adminPermissionRevoked)="adminPermissionRevoked.emit($event)"
    (adminModerationRequested)="adminModerationRequested.emit($event)"
    (adminNoteAdded)="adminNoteAdded.emit($event)"
    (socialPlayersSearchChanged)="socialPlayersSearchChanged.emit($event)"
    (socialPlayersPageChanged)="socialPlayersPageChanged.emit($event)"
    (friendAddCharacterRequested)="friendAddCharacterRequested.emit($event)"
    (friendAddProfileRequested)="friendAddProfileRequested.emit($event)"
    (friendAcceptRequested)="friendAcceptRequested.emit($event)"
    (friendRejectRequested)="friendRejectRequested.emit($event)"
    (friendshipRemoveRequested)="friendshipRemoveRequested.emit($event)"
    (guildCreateRequested)="guildCreateRequested.emit($event)"
    (guildInviteRequested)="guildInviteRequested.emit($event)"
    (guildInvitationResponded)="guildInvitationResponded.emit($event)"
    (guildRoleChanged)="guildRoleChanged.emit($event)"
    (guildLeaveRequested)="guildLeaveRequested.emit($event)"
    (channelLeaveRequested)="channelLeaveRequested.emit($event)"
    (channelCloseRequested)="channelCloseRequested.emit($event)"
    (channelDestroyRequested)="channelDestroyRequested.emit($event)"
    (moderationSubmitted)="serverModerationSubmitted.emit($event)"
    (moderationCleared)="serverModerationCleared.emit()"
    (sendRequested)="serverChatSendRequested.emit($event)"
    (openServerSelectRequested)="serverChatServerSelectRequested.emit()"
  />

  <gv-shell-server-admin-dialog
    [open]="isServerAdminOpen()"
    [statusMessage]="serverAdminStatusMessage()"
    [submitting]="isServerAdminSubmitting()"
    (closed)="serverAdminCloseRequested.emit()"
    (submitted)="serverAdminSubmitted.emit($event)"
  />

  <gv-shell-gameplay-log-dialog
    [open]="isGameplayLogOpen()"
    [entries]="gameplayLogEntries()"
    [debugEntries]="debugLogEntries()"
    (closed)="gameplayLogCloseRequested.emit()"
  />

  <gv-shell-quest-log-dialog
    [open]="isQuestLogOpen()"
    [quests]="questLogQuests()"
    [trackedQuestIds]="trackedQuestIds()"
    (openChange)="
      !$event ? questLogCloseRequested.emit() : questLogOpenRequested.emit()
    "
    (trackQuestChange)="trackedQuestIdsChanged.emit($event)"
  />

  <gv-shell-character-sheet-dialog
    [open]="isCharacterSheetOpen()"
    [panel]="characterPanel()"
    (closed)="characterSheetCloseRequested.emit()"
  />

  <gv-shell-geg-visualizer-dialog
    [open]="isGegVisualizerOpen()"
    [snapshot]="gegDebugSnapshot()"
    (closed)="gegVisualizerCloseRequested.emit()"
  />

  <gv-shell-character-creation-dialog
    [open]="isCharacterCreationOpen()"
    [required]="isCharacterCreationRequired()"
    (closed)="characterCreationCloseRequested.emit()"
    (characterCreated)="characterCreated.emit()"
  />

  <gv-whats-new-modal
    [open]="isWhatsNewOpen()"
    [releases]="whatsNewReleases()"
    [loading]="isWhatsNewLoading()"
    [errorMessage]="whatsNewErrorMessage()"
    (closed)="whatsNewCloseRequested.emit()"
    (markReadRequested)="whatsNewMarkReadRequested.emit()"
  />

  <gv-game-dialog
    [session]="gameDialogSession()"
    (advanceRequested)="gameDialogAdvanceRequested.emit()"
    (choiceSelected)="gameDialogChoiceSelected.emit($event)"
    (closeRequested)="gameDialogCloseRequested.emit()"
  />
</div>
