<footer class="gv-footer">
  <div class="gv-footer__tip">
    <strong class="gv-footer__tip-title">
      <span class="gv-footer__tip-icon" aria-hidden="true">&#128161;</span>
      <span>Tip</span>
    </strong>
    <p class="gv-footer__tip-text">{{ tip() }}</p>
  </div>

  <div class="gv-footer__links">
    <button
      type="button"
      class="gv-footer__btn gv-footer__btn--server"
      [class.gv-footer__btn--server-live]="serverSummary().isConnected"
      (click)="serverInfoRequested.emit()"
    >
      <span class="gv-footer__server-label">{{ serverSummary().label }}</span>
      <span class="gv-footer__server-detail">{{ serverSummary().detail }}</span>
    </button>
    <!-- GAP: ChangelogModalService not yet available — button is a visual placeholder -->
    <button
      type="button"
      class="gv-footer__btn gv-footer__btn--version"
      [attr.title]="
        whatsNewUnreadCount() > 0
          ? 'Unread release notes available'
          : 'Open release notes'
      "
      (click)="whatsNewRequested.emit()"
    >
      v{{ version() }}
      @if (whatsNewUnreadCount() > 0) {
        <span
          class="gv-footer__version-badge"
          aria-label="{{ whatsNewUnreadCount() }} unread releases"
        >
          {{ whatsNewUnreadCount() }}
        </span>
      }
    </button>

    <!-- GAP: WikiModalService not yet available — button is a visual placeholder -->
    <button type="button" class="gv-footer__btn" disabled>Game Wiki</button>

    <button
      type="button"
      class="gv-footer__btn gv-footer__btn--debug"
      (click)="gegVisualizerRequested.emit()"
    >
      GEG Debug
    </button>

    <span class="gv-footer__author">Tear Star</span>

    <a
      class="gv-footer__repo-link"
      href="https://github.com/XIVRinner/grayvale"
      target="_blank"
      rel="noreferrer noopener"
      aria-label="Private GitHub repository for Tear Star"
    >
      <i class="pi pi-github" aria-hidden="true"></i>
      GitHub
      <span class="gv-footer__repo-lock" aria-hidden="true">&#128274;</span>
    </a>
  </div>
</footer>
