<gv-dialog-shell
  [open]="open()"
  title="Gameplay Log"
  eyebrow="Field Record"
  subtitle="A player-facing recap plus a runtime trace for gameplay actions and state transitions."
  ariaLabel="Gameplay log"
  [variant]="'special'"
  [width]="'log'"
  (closed)="closed.emit()"
>
  <section class="gv-gameplay-log" aria-label="Gameplay log entries">
    @if (!hasAnyData()) {
      <div class="gv-gameplay-log__empty">
        <p class="gv-gameplay-log__empty-title">No gameplay entries yet.</p>
        <p class="gv-gameplay-log__empty-copy">
          Quest updates, loot, combat results, and runtime trace messages will appear here.
        </p>
      </div>
    } @else {
      <gv-shell-gameplay-log-filter-bar
        [section]="activeSection()"
        [feedFilter]="activeFeedFilter()"
        [traceScope]="activeTraceScope()"
        [availableScopes]="availableScopes()"
        (sectionChanged)="activeSection.set($event)"
        (feedFilterChanged)="activeFeedFilter.set($event)"
        (traceScopeChanged)="activeTraceScope.set($event)"
      />

      @if (isFeedActive()) {
        <gv-shell-gameplay-log-feed-list [entries]="filteredFeedEntries()" />
      }

      @if (isTraceActive()) {
        <gv-shell-gameplay-log-trace-list [entries]="filteredTraceEntries()" />
      }
    }
  </section>
</gv-dialog-shell>
