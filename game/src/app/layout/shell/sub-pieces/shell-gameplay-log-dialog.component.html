<gv-dialog-shell
  [open]="open()"
  title="Gameplay Log"
  eyebrow="Field Record"
  subtitle="Merged gameplay and runtime events in a console-style readout."
  ariaLabel="Gameplay log"
  [variant]="'special'"
  [width]="'log'"
  (closed)="closed.emit()"
>
  <section class="gv-gameplay-log" aria-label="Gameplay log entries">
    @if (!hasAnyData()) {
      <div class="gv-gameplay-log__empty">
        <p class="gv-gameplay-log__empty-title">No gameplay entries yet.</p>
        <p class="gv-gameplay-log__empty-copy">
          Gameplay and runtime lines appear here as they are recorded.
        </p>
      </div>
    } @else {
      <ol class="gv-gameplay-log__console" aria-label="Console log lines">
        @for (line of consoleLines(); track $index) {
          <li class="gv-gameplay-log__line">{{ line }}</li>
        }
      </ol>
    }
  </section>
</gv-dialog-shell>
