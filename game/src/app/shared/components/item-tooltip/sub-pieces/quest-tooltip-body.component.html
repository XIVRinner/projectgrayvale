<div class="gv-quest-tooltip-body">

  <div class="gv-tooltip-section gv-tooltip-section--quest-context">
    <span class="gv-tooltip-section__label">Quest / Use</span>
    <span class="gv-tooltip-quest-context">{{ item().questContext.replace(/_/g, " ") }}</span>
  </div>

  <div class="gv-tooltip-section gv-tooltip-section--state">
    <span class="gv-tooltip-section__label">Status</span>
    <span class="gv-tooltip-state" [attr.data-locked]="item().locked ?? false">{{ stateLabel() }}</span>
    @if (designationLabel(); as designation) {
      <span class="gv-tooltip-designation">{{ designation }}</span>
    }
  </div>

  @if (item().description || item().flavor) {
    <div class="gv-tooltip-section gv-tooltip-section--flavor">
      @if (item().description; as desc) {
        <p class="gv-tooltip-description">{{ desc }}</p>
      }
      @if (item().flavor; as flavor) {
        <p class="gv-tooltip-flavor">"{{ flavor }}"</p>
      }
    </div>
  }

</div>
