<button
  type="button"
  class="gv-whats-new-button"
  [attr.title]="unreadCount() > 0 ? 'Unread release notes available' : 'Open release notes'"
  (click)="opened.emit()"
>
  <i class="pi pi-megaphone" aria-hidden="true"></i>
  <span class="gv-whats-new-button__label">What's New</span>
  @if (unreadCount() > 0) {
    <span class="gv-whats-new-button__badge">{{ unreadCount() }}</span>
  }
</button>
